<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xlsx-view preview</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      main {
        max-width: 960px;
      }

      #app input {
        width: 96px;
      }

      pre {
        background: #f5f5f5;
        padding: 16px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>xlsx-view</h1>
      <p>GitHub Pages 预览页：展示 TypeScript 库输出的最小可编辑工作表。</p>
      <div id="app"></div>
      <h2>Workbook Snapshot</h2>
      <pre id="snapshot"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
